<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title data-i18n="historyLink">History</title>
    <link rel="stylesheet" href="../shared/sidebar.css">
    <link rel="stylesheet" href="history.css">
    <link rel="stylesheet" href="../shared/favorite-folder-modal.css">
</head>
<body data-page="history">
    <div class="page-layout">
        <div id="appSidebarMount"></div>
        <div class="history-container">
            <div class="history-header">
                <div class="history-title">
                    <h1 data-i18n="historyLink">History</h1>
                </div>
                <button id="clearHistoryBtn" class="clear-btn" data-i18n="clearHistoryButton">Clear History</button>
            </div>
            <div class="search-container">
                <input type="text" id="searchInput" class="search-input" placeholder="Search by query ..." data-i18n-placeholder="searchHistoryPlaceholder">
            </div>
            <div id="historyList" class="history-list">
                <!-- 历史记录将动态加载到这里 -->
            </div>
            <div id="emptyState" class="empty-state" style="display: none;">
                <div class="empty-icon">📋</div>
                <div class="empty-text" data-i18n="noHistoryRecord">No history record</div>
            </div>
            <div id="noResultsState" class="empty-state" style="display: none;">
                <div class="empty-icon">🔍</div>
                <div class="empty-text" data-i18n="noResultsFound">No results found</div>
                <div class="empty-hint" data-i18n="tryDifferentKeywords">Try different keywords</div>
            </div>
        </div>
    </div>
    <script src="../shared/site-launch-utils.js"></script>
    <script src="../config/baseConfig.js"></script>
    <script src="../config/firebaseConfig.js"></script>
    <script src="../firebase/firebase-auth.js"></script>
    <script src="../firebase/firebase-sync.js"></script>
    <script src="../shared/favorite-folder-modal.js"></script>
    <script src="../shared/url-tooltip.js"></script>
    <script src="../shared/sidebar.js"></script>
    <script src="history.js"></script>
</body>
</html>
