<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title data-i18n="favoritesLink">Favorites</title>
    <link rel="stylesheet" href="../shared/ui-tokens.css">
    <link rel="stylesheet" href="../shared/sidebar.css">
    <link rel="stylesheet" href="favorites.css">
    <link rel="stylesheet" href="../shared/favorite-folder-modal.css">
</head>
<body data-page="favorites">
    <div class="page-layout">
        <div id="appSidebarMount"></div>
        <div class="favorites-container">
            <div class="favorites-header">
                <div class="favorites-title">
                    <h1 data-i18n="favoritesLink">Favorites</h1>
                </div>
                <button id="clearFavoritesBtn" class="clear-btn" data-i18n="clearFavoritesButton">Clear All Favorites</button>
            </div>
            <div id="folderTabsContainer" class="folder-tabs-container">
                <!-- Folder tabs rendered dynamically -->
            </div>
            <div class="search-container">
                <input type="text" id="searchInput" class="search-input" placeholder="Search by query ..." data-i18n-placeholder="searchFavoritesPlaceholder">
            </div>
            <div id="favoritesList" class="favorites-list">
                <!-- 收藏记录将动态加载到这里 -->
            </div>
            <div id="emptyState" class="empty-state" style="display: none;">
                <div class="empty-icon">⭐</div>
                <div class="empty-text" data-i18n="noFavoriteRecord">No favorite record</div>
            </div>
            <div id="noResultsState" class="empty-state" style="display: none;">
                <div class="empty-icon">🔍</div>
                <div class="empty-text" data-i18n="noResultsFound">No results found</div>
                <div class="empty-hint" data-i18n="tryDifferentKeywords">Try different keywords</div>
            </div>
        </div>
    </div>
    <script src="../shared/site-launch-utils.js"></script>
    <script src="../config/baseConfig.js"></script>
    <script src="../shared/runtime-i18n.js"></script>
    <script src="../shared/favorite-folder-modal.js"></script>
    <script src="../shared/hybrid-history-db.js"></script>
    <script src="../shared/hybrid-favorites.js"></script>
    <script src="../shared/url-tooltip.js"></script>
    <script src="../shared/behavior-insights.js"></script>
    <script src="../shared/sidebar.js"></script>
    <script src="favorites.js"></script>
</body>
</html>
