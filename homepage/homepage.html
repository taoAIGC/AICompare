<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title data-i18n="appName"></title>
    <link rel="stylesheet" href="../shared/ui-tokens.css">
    <link rel="stylesheet" href="../shared/sidebar.css">
    <link rel="stylesheet" href="homepage.css">
</head>
<body data-page="homepage">
    <div class="homepage-layout">
        <!-- 左侧导航区（共享） -->
        <div id="appSidebarMount">
            <div class="sidebar-nav sidebar-nav-skeleton" aria-hidden="true">
                <div class="sidebar-nav-header">
                    <div class="sidebar-skeleton-icon skeleton-block"></div>
                    <div class="sidebar-skeleton-title skeleton-block"></div>
                </div>
                <div class="sidebar-nav-body sidebar-skeleton-body">
                    <div class="sidebar-skeleton-link skeleton-block"></div>
                    <div class="sidebar-skeleton-link skeleton-block"></div>
                    <div class="sidebar-skeleton-link skeleton-block"></div>
                    <div class="sidebar-skeleton-link skeleton-block"></div>
                    <div class="sidebar-skeleton-section-title skeleton-block"></div>
                    <div class="sidebar-skeleton-favorite skeleton-block"></div>
                    <div class="sidebar-skeleton-favorite skeleton-block"></div>
                    <div class="sidebar-skeleton-favorite skeleton-block"></div>
                </div>
                <div class="sync-bar-wrap">
                    <div class="sync-bar sidebar-skeleton-sync">
                        <div class="sidebar-skeleton-sync-icon skeleton-block"></div>
                        <div class="sidebar-skeleton-sync-text skeleton-block"></div>
                    </div>
                </div>
            </div>
        </div>
        <!-- 主内容区 -->
        <div class="homepage-container">
            <!-- Pin 引导提示 -->
            <div id="pinGuideBanner" class="pin-guide-banner" style="display: none;">
                <div class="pin-guide-content">
                    <div class="pin-guide-icon">📌</div>
                    <div class="pin-guide-text">
                        <div class="pin-guide-title" data-i18n="pinGuideTitle"></div>
                        <div class="pin-guide-steps" data-i18n="pinGuideSteps"></div>
                    </div>
                    <!--
                    <img id="pinGuideImage" src="" data-i18n-alt="pinGuideImageAlt" alt="Pin" class="pin-guide-image">
                    -->
                    <button id="pinGuideClose" class="pin-guide-close" data-i18n-aria-label="closeButton" aria-label="Close">×</button>
                </div>
            </div>
            <div class="extension-icon-container">
                <h1 id="extensionName" class="extension-name" data-i18n="shortName"></h1>
            </div>
            <div id="coursePromoBanner" class="homepage-course-promo" hidden></div>
            <!--
            <div id="homepagePlanBanner" class="homepage-plan-banner" role="status" hidden>
                <div class="homepage-plan-banner-copy">
                    <span data-i18n="homepageFreePlanBannerPrefix">You're currently on the Free plan. 💪🏻</span>
                    <button id="homepagePlanBannerUpgradeBtn" type="button" class="homepage-plan-banner-link" data-i18n="homepageFreePlanBannerAction">Upgrade to Premium</button>
                    <span data-i18n="homepageFreePlanBannerSuffix">to unlock advanced features.</span>
                </div>
            </div>
            -->
            <!--
            <div id="remoteSearchStatusCard" class="remote-search-home-card" hidden>
                <div class="remote-search-home-copy">
                    <div class="remote-search-home-title" data-i18n="remoteSearchHomepageTitle">Remote Search</div>
                    <div id="remoteSearchHomeDescription" class="remote-search-home-description" data-i18n="remoteSearchHomepageDescription">Pair one phone to this Chrome session and launch compare searches remotely.</div>
                </div>
                <div class="remote-search-home-actions">
                    <span id="remoteSearchHomeBadge" class="remote-search-home-badge" data-status="disabled" data-i18n="remoteSearchStatusDisabled">Disabled</span>
                    <button id="remoteSearchOpenSettingsBtn" type="button" class="remote-search-home-button" data-i18n="remoteSearchOpenSettingsButton">Open settings</button>
                </div>
            </div>
            -->
            <div class="search-input-container">
                <div class="input-wrapper">
                    <textarea
                        id="searchInput"
                        placeholder=""
                        rows="1"
                    ></textarea>
                    <div class="input-actions">
                        <button id="fileUploadButton" class="file-upload-btn" data-i18n-title="fileUploadButtonTitle" data-i18n-aria-label="fileUploadButtonTitle" title="" aria-label="">
                            <img src="../icons/attachment.svg" data-i18n-alt="fileUploadButtonAlt" alt="">
                        </button>
                        <button
                            id="batchModeButton"
                            type="button"
                            class="file-upload-btn batch-mode-btn"
                            data-i18n-title="homepageBatchModeButtonTitle"
                            data-i18n-aria-label="homepageBatchModeButtonTitle"
                            title=""
                            aria-label=""
                            aria-haspopup="dialog"
                        >
                            <img src="../icons/list-start.svg" alt="">
                        </button>
                        <button id="searchButton" class="search-btn" data-i18n="startCompare" data-i18n-title="startCompare" data-i18n-aria-label="startCompare" title="" aria-label=""></button>
                    </div>
                </div>
                <button id="coursePromoTextAd" class="homepage-course-promo-text-ad" type="button" hidden></button>
                <div id="querySuggestions" class="query-suggestions" style="display: none;">
                    <!-- queryItem.name 将显示在这里 -->
                </div>
            </div>

            <div id="batchModeModal" class="batch-mode-modal" hidden>
                <div id="batchModeBackdrop" class="batch-mode-modal-backdrop"></div>
                <div class="batch-mode-modal-dialog" role="dialog" aria-modal="true" aria-labelledby="batchModeModalTitle">
                    <div class="batch-mode-modal-header">
                        <h2 id="batchModeModalTitle" class="batch-mode-modal-title" data-i18n="homepageBatchDialogTitle"></h2>
                        <div class="batch-mode-toolbar">
                            <div id="batchModeFavoritesList" class="batch-mode-favorites" aria-live="polite"></div>
                            <button
                                id="batchModeSaveFavoriteButton"
                                type="button"
                                class="batch-mode-save-btn"
                                data-i18n="homepageBatchFavoriteAction"
                            ></button>
                        </div>
                    </div>
                    <div class="batch-mode-editor">
                        <div id="batchModeEditor" class="batch-mode-editor-host" aria-label=""></div>
                    </div>
                    <div class="batch-mode-modal-footer">
                        <button id="batchModeCancelButton" type="button" class="batch-mode-modal-btn batch-mode-modal-btn-secondary" data-i18n="cancel"></button>
                        <button id="batchModeSubmitButton" type="button" class="batch-mode-modal-btn batch-mode-modal-btn-primary" data-i18n="startCompare"></button>
                    </div>
                </div>
            </div>

            <div id="batchModeFavoriteNameModal" class="batch-mode-name-modal" hidden>
                <div id="batchModeFavoriteNameBackdrop" class="batch-mode-name-modal-backdrop"></div>
                <div class="batch-mode-name-modal-dialog" role="dialog" aria-modal="true" aria-labelledby="batchModeFavoriteNameTitle">
                    <h3 id="batchModeFavoriteNameTitle" class="batch-mode-name-modal-title" data-i18n="homepageBatchFavoriteDialogTitle"></h3>
                    <input
                        id="batchModeFavoriteNameInput"
                        type="text"
                        class="batch-mode-name-input"
                        maxlength="40"
                        data-i18n-placeholder="homepageBatchFavoriteNamePlaceholder"
                        placeholder=""
                    >
                    <div class="batch-mode-name-modal-footer">
                        <button id="batchModeFavoriteNameCancelButton" type="button" class="batch-mode-modal-btn batch-mode-modal-btn-secondary" data-i18n="cancel"></button>
                        <button id="batchModeFavoriteNameConfirmButton" type="button" class="batch-mode-modal-btn batch-mode-modal-btn-primary" data-i18n="saveButton"></button>
                    </div>
                </div>
            </div>

            <!--
            <div class="site-filter-bar">
                <div id="siteTypeTabs" class="site-type-tabs" role="tablist" data-i18n-aria-label="siteTypeTabsAriaLabel" aria-label="Site types"></div>
            </div>
            -->

            <div class="sites-section combined-selection-section">
                <div class="sites-header">
                    <h3 class="sites-title" data-i18n="selectAISites"></h3>
                    <button id="saveSitesBtn" class="save-settings-btn" aria-label="">
                        <img src="../icons/save.svg" data-i18n-alt="saveIconAlt" alt="save" class="save-icon">
                    </button>
                    <span class="save-btn-tooltip" data-i18n="saveFavoriteSitesTitle"></span>
                </div>
                <div class="selection-group">
                    <div id="sitesList" class="sites-list sites-list-skeleton" aria-busy="true">
                        <div class="site-item site-item-skeleton" aria-hidden="true">
                            <span class="site-drag-handle skeleton-block"></span>
                            <span class="site-checkbox-skeleton skeleton-block"></span>
                            <span class="site-avatar-skeleton skeleton-block"></span>
                            <span class="site-name-skeleton skeleton-block"></span>
                        </div>
                        <div class="site-item site-item-skeleton" aria-hidden="true">
                            <span class="site-drag-handle skeleton-block"></span>
                            <span class="site-checkbox-skeleton skeleton-block"></span>
                            <span class="site-avatar-skeleton skeleton-block"></span>
                            <span class="site-name-skeleton skeleton-block"></span>
                        </div>
                        <div class="site-item site-item-skeleton" aria-hidden="true">
                            <span class="site-drag-handle skeleton-block"></span>
                            <span class="site-checkbox-skeleton skeleton-block"></span>
                            <span class="site-avatar-skeleton skeleton-block"></span>
                            <span class="site-name-skeleton skeleton-block"></span>
                        </div>
                        <div class="site-item site-item-skeleton" aria-hidden="true">
                            <span class="site-drag-handle skeleton-block"></span>
                            <span class="site-checkbox-skeleton skeleton-block"></span>
                            <span class="site-avatar-skeleton skeleton-block"></span>
                            <span class="site-name-skeleton skeleton-block"></span>
                        </div>
                        <div class="site-item site-item-skeleton" aria-hidden="true">
                            <span class="site-drag-handle skeleton-block"></span>
                            <span class="site-checkbox-skeleton skeleton-block"></span>
                            <span class="site-avatar-skeleton skeleton-block"></span>
                            <span class="site-name-skeleton skeleton-block"></span>
                        </div>
                        <div class="site-item site-item-skeleton" aria-hidden="true">
                            <span class="site-drag-handle skeleton-block"></span>
                            <span class="site-checkbox-skeleton skeleton-block"></span>
                            <span class="site-avatar-skeleton skeleton-block"></span>
                            <span class="site-name-skeleton skeleton-block"></span>
                        </div>
                    </div>
                </div>
                <div id="agentsSection" class="selection-group agents-section">
                    <div class="selection-group-header">
                        <h4 class="selection-group-title" data-i18n="homepageAgentsTitle"></h4>
                        <div class="selection-group-actions">
                            <button id="selectAllAgentsBtn" type="button" class="selection-group-action-btn" data-i18n="homepageAgentsSelectAll">全选</button>
                            <button id="clearAllAgentsBtn" type="button" class="selection-group-action-btn" data-i18n="homepageAgentsClearAll">取消全选</button>
                        </div>
                    </div>
                    <div id="agentsList" class="sites-list"></div>
                </div>
            </div>

            <div class="sites-section custom-sites-section">
                <div class="sites-header">
                    <h3 class="sites-title" data-i18n="customSitesTitle"></h3>
                </div>
                <div id="customSitesList" class="sites-list sites-list-skeleton" aria-busy="true">
                    <div class="site-item site-item-skeleton" aria-hidden="true">
                        <span class="site-checkbox-skeleton skeleton-block"></span>
                        <span class="site-avatar-skeleton skeleton-block"></span>
                        <span class="site-name-skeleton skeleton-block"></span>
                    </div>
                    <div class="site-item site-item-skeleton" aria-hidden="true">
                        <span class="site-checkbox-skeleton skeleton-block"></span>
                        <span class="site-avatar-skeleton skeleton-block"></span>
                        <span class="site-name-skeleton skeleton-block"></span>
                    </div>
                    <div class="site-item site-item-skeleton" aria-hidden="true">
                        <span class="site-checkbox-skeleton skeleton-block"></span>
                        <span class="site-avatar-skeleton skeleton-block"></span>
                        <span class="site-name-skeleton skeleton-block"></span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../shared/site-launch-utils.js"></script>
    <script src="../config/baseConfig.js"></script>
    <script src="../config/firebaseConfig.js"></script>
    <script src="../shared/behavior-insights.js"></script>
    <script src="../config/analytics.js"></script>
    <script src="../shared/runtime-i18n.js"></script>
    <script src="../shared/prompt-template-utils.js"></script>
    <script src="../shared/submit-shortcut-utils.js"></script>
    <script src="../shared/textarea-resize-utils.js"></script>
    <script src="../shared/url-tooltip.js"></script>
    <script src="../shared/sidebar.js"></script>
    <script src="../config/agentCatalogData.js"></script>
    <script src="../config/agentCatalog.js"></script>
    <script src="../vendor/ace/ace.js"></script>
    <script src="site-indicator-utils.js"></script>
    <script src="homepage.js"></script>
</body>
</html>
