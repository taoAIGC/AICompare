<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title data-i18n="appName"></title>
  <link rel="stylesheet" href="../shared/ui-tokens.css">
  <link rel="stylesheet" href="../shared/sidebar.css">
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="page-layout">
    <!-- 左侧导航栏（与 homepage 风格一致） -->
    <nav class="sidebar-nav">
      <div class="sidebar-nav-header">
        <a class="app-icon-link" href="../homepage/homepage.html" data-i18n-title="openHomepageLabel" data-i18n-aria-label="openHomepageLabel" title="Go to homepage" aria-label="Go to homepage">
          <img class="app-icon" src="../icons/chevron-left.svg" alt="">
        </a>
      </div>
      <div class="action-links">
        <a href="#quick-entry" class="action-link nav-link active" data-section="quick-entry">
          <img class="action-link-icon" src="../icons/extension-setting.svg" alt="" aria-hidden="true">
          <span data-i18n="settingsNavShortcutsTitle"></span>
        </a>
        <a href="#launch-settings" class="action-link nav-link" data-section="launch-settings">
          <img class="action-link-icon" src="../icons/layout-grid.svg" alt="" aria-hidden="true">
          <span data-i18n="settingsNavSitesTitle"></span>
        </a>
        <a href="#agent-settings" class="action-link nav-link" data-section="agent-settings">
          <img class="action-link-icon" src="../icons/brain.svg" alt="" aria-hidden="true">
          <span data-i18n="settingsNavSkillsTitle"></span>
        </a>
        <a href="#agent-engine" class="action-link nav-link" data-section="agent-engine">
          <img class="action-link-icon" src="../icons/move-3d.svg" alt="" aria-hidden="true">
          <span data-i18n="settingsNavApiTitle"></span>
        </a>
        <a href="#prompt-templates" class="action-link nav-link" data-section="prompt-templates">
          <img class="action-link-icon" src="../icons/message-square-share.svg" alt="" aria-hidden="true">
          <span data-i18n="promptTemplatesTitle"></span>
        </a>
        <a href="#analysis-prompt-templates" class="action-link nav-link" data-section="analysis-prompt-templates">
          <img class="action-link-icon" src="../icons/file-chart-column.svg" alt="" aria-hidden="true">
          <span data-i18n="analysisPromptTemplatesTitle"></span>
        </a>
        <a href="#data-sync" class="action-link nav-link" data-section="data-sync">
          <img class="action-link-icon" src="../icons/cloud-sync.svg" alt="" aria-hidden="true">
          <span data-i18n="settingsNavSyncTitle"></span>
        </a>
        <a href="#language-settings" class="action-link nav-link" data-section="language-settings">
          <img class="action-link-icon" src="../icons/globe.svg" alt="" aria-hidden="true">
          <span data-i18n="settingsNavLanguageTitle"></span>
        </a>
        <a href="#membership" class="action-link nav-link" data-section="membership">
          <img class="action-link-icon" src="../icons/user.svg" alt="" aria-hidden="true">
          <span data-i18n="settingsNavProTitle">Account</span>
        </a>
        <!-- 暂时隐藏 Remote Search 导航入口
        <a href="#remote-search" class="action-link nav-link" data-section="remote-search">
          <img class="action-link-icon" src="../icons/smartphone.svg" alt="" aria-hidden="true">
          <span data-i18n="remoteSearchTitle"></span>
        </a>
        -->
      </div>
    </nav>

    <!-- 主内容区域 -->
    <main class="main-content">
      <div class="container">
        <!-- 快捷入口设置 -->
        <section id="quick-entry" class="settings-section">
          <h1 data-i18n="configButtonTitle"></h1>
          <div class="site-section">
            <div id="buttonSiteConfigs" class="site-configs"></div>
            <div id="sendShortcutConfig" class="site-configs"></div>
          </div>

          <div class="site-section quick-entry-subsection">
            <h2 data-i18n="disabledSitesTitle"></h2>
            <p class="section-description" data-i18n="disabledSitesDescription"></p>
            <div class="disabled-sites-section">
              <div id="disabledSitesList" class="disabled-sites-list">
                <!-- 禁用网站列表将在这里动态生成 -->
              </div>
            </div>
          </div>

          <div class="site-section quick-entry-subsection">
            <h2 data-i18n="diagnosticsSettingsTitle"></h2>
            <div id="failureLogSyncConfig" class="site-configs"></div>
          </div>
        </section>

        <!-- 启动网址设置 -->
        <section id="launch-settings" class="settings-section">
          <h1 data-i18n="launchSettingsTitle"></h1>

          <div class="site-section">
            <h2 data-i18n="officialEntryUrlTitle"></h2>
            <p class="section-description" data-i18n="officialEntryUrlDescription"></p>
            <div id="officialEntryUrlConfigs" class="site-configs"></div>
          </div>

          <div id="custom-sites-settings" class="site-section site-section-spaced">
            <h2 data-i18n="customSitesTitle"></h2>

            <div class="template-header">
              <button id="addCustomSiteBtn" class="btn-primary template-add-button">
                <span>+ </span><span data-i18n="addCustomSiteButton"></span>
              </button>
            </div>

            <div id="customSitesAdminList" class="site-configs"></div>
          </div>
        </section>

        <section id="agent-settings" class="settings-section">
          <div class="settings-section-header agent-settings-section-header">
            <h1 data-i18n="agentSettingsTitle"></h1>
            <div class="agent-actions-group">
              <button id="addAgentBtn" class="btn-primary template-add-button" type="button" data-i18n="agentNewButton"></button>
              <button id="importAgentBtn" class="btn-primary template-add-button" type="button" data-i18n="agentImportButton"></button>
            </div>
          </div>

          <div id="agent-custom-settings" class="site-section unified-settings-panel">
            <div id="agentCustomSettingsList" class="templates-list"></div>
          </div>
        </section>

        <section id="agent-engine" class="settings-section">
          <h1 data-i18n="agentEngineTitle"></h1>

          <div class="site-section unified-settings-panel">
            <div class="agent-engine-list" role="list">
              <div id="officialAgentEngineCard" class="agent-engine-row agent-engine-option-card" data-source="official" data-selected="true">
                <button id="officialAgentEngineSelectBtn" class="agent-engine-row-main" type="button">
                  <span class="agent-engine-select-indicator" aria-hidden="true"></span>
                  <span class="agent-engine-row-copy">
                    <span class="agent-engine-row-title" data-i18n="agentEngineOfficialOptionTitle"></span>
                    <span id="officialAgentEngineMeta" class="agent-engine-row-meta"></span>
                  </span>
                </button>
                <button id="officialAgentEngineUpgradeBtn" class="btn-secondary agent-engine-inline-btn" type="button" data-i18n="agentEngineUpgradeButton" hidden></button>
              </div>

              <div id="agentEngineCard" class="agent-engine-row agent-engine-option-card" data-source="custom" data-status="unconfigured" data-selected="false">
                <button id="customAgentEngineSelectBtn" class="agent-engine-row-main" type="button">
                  <span class="agent-engine-select-indicator" aria-hidden="true"></span>
                  <span class="agent-engine-row-copy">
                    <span class="agent-engine-row-title" data-i18n="agentEngineCustomOptionTitle"></span>
                    <span id="customAgentEngineMeta" class="agent-engine-row-hint" data-i18n="agentEngineCustomCardHint"></span>
                  </span>
                  <span id="agentEngineStatusBadge" class="agent-engine-status-badge" data-i18n="agentEngineStatusUnconfigured"></span>
                </button>
                <button id="editAgentEngineBtn" class="btn-secondary agent-engine-inline-btn" type="button" data-i18n="agentEngineEditButton"></button>
              </div>
            </div>
          </div>
        </section>

        <!-- 提示词模板管理 -->
        <section id="prompt-templates" class="settings-section">
          <h1 data-i18n="promptTemplatesTitle"></h1>
          <p class="section-description" data-i18n="promptTemplatesDescription"></p>
          
          <div class="prompt-templates-section unified-settings-panel">
            <!-- 添加新模板按钮 -->
            <div class="template-header">
              <button id="addTemplateBtn" class="btn-primary add-template-btn template-add-button">
                <span>+ </span><span data-i18n="addTemplateButton"></span>
              </button>
            </div>

            <!-- 模板列表 -->
            <div id="templatesList" class="templates-list">
              <!-- 模板项将动态生成 -->
            </div>

            <!-- 添加/编辑模板对话框 -->
            <div id="templateDialog" class="template-dialog" style="display: none;">
              <div class="dialog-overlay" id="dialogOverlay"></div>
              <div class="dialog-content">
                <div class="dialog-header">
                  <h3 id="dialogTitle" data-i18n="addTemplateTitle" class="dialog-title"></h3>
                  <button class="dialog-close" id="dialogClose">×</button>
                </div>
                <div class="dialog-body">
                  <div class="form-group">
                    <label for="templateName" data-i18n="templateNameLabel" class="form-label"></label>
                    <input type="text" id="templateName" class="dialog-field" data-i18n-placeholder="templateNamePlaceholder" placeholder="" maxlength="20">
                    <div class="help-text" data-i18n="templateNameHelp"></div>
                  </div>
                  
                  <div class="form-group">
                    <label for="templateQuery" data-i18n="templateQueryLabel" class="form-label"></label>
                    <textarea id="templateQuery" class="dialog-field" data-i18n-placeholder="templateQueryPlaceholder" placeholder="" rows="3"></textarea>
                    <div class="help-text" data-i18n="templateQueryHelp"></div>
                  </div>

                  <div class="form-group">
                    <label for="templateType" data-i18n="templateTypeLabel" class="form-label"></label>
                    <select id="templateType" class="dialog-field"></select>
                    <div class="help-text" data-i18n="templateTypeHelp"></div>
                  </div>

                  <div class="form-group form-group-compact">
                    <label for="templateOrder" data-i18n="templateOrderLabel" class="form-label"></label>
                    <input type="number" id="templateOrder" class="dialog-field dialog-field-narrow" min="1" max="99" value="1">
                    <div class="help-text" data-i18n="templateOrderHelp"></div>
                  </div>
                </div>
                <div class="dialog-footer">
                  <button id="cancelTemplate" class="btn-secondary" data-i18n="cancelButton"></button>
                  <button id="saveTemplate" class="btn-primary" data-i18n="saveButton"></button>
                </div>
              </div>
            </div>
          </div>
        </section>

        <section id="analysis-prompt-templates" class="settings-section">
          <h1 data-i18n="analysisPromptTemplatesTitle"></h1>
          <p class="section-description" data-i18n="analysisPromptTemplatesDescription"></p>

          <div class="prompt-templates-section unified-settings-panel">
            <div class="template-header">
              <button id="addAnalysisTemplateBtn" class="btn-primary add-template-btn template-add-button">
                <span>+ </span><span data-i18n="addAnalysisTemplateButton"></span>
              </button>
            </div>

            <div id="analysisTemplatesList" class="templates-list"></div>

            <div id="analysisTemplateDialog" class="template-dialog" style="display: none;">
              <div class="dialog-overlay" id="analysisDialogOverlay"></div>
              <div class="dialog-content">
                <div class="dialog-header">
                  <h3 id="analysisDialogTitle" data-i18n="addAnalysisTemplateTitle" class="dialog-title"></h3>
                  <button class="dialog-close" id="analysisDialogClose">×</button>
                </div>
                <div class="dialog-body">
                  <div class="form-group">
                    <label for="analysisTemplateName" data-i18n="templateNameLabel" class="form-label"></label>
                    <input type="text" id="analysisTemplateName" class="dialog-field" data-i18n-placeholder="analysisTemplateNamePlaceholder" placeholder="" maxlength="20">
                    <div class="help-text" data-i18n="analysisTemplateNameHelp"></div>
                  </div>

                  <div class="form-group">
                    <label for="analysisTemplateQuery" data-i18n="templateQueryLabel" class="form-label"></label>
                    <textarea id="analysisTemplateQuery" class="dialog-field" data-i18n-placeholder="analysisTemplateQueryPlaceholder" placeholder="" rows="6"></textarea>
                    <div class="help-text" data-i18n="analysisTemplateQueryHelp"></div>
                  </div>

                  <div class="form-group form-group-compact">
                    <label for="analysisTemplateOrder" data-i18n="templateOrderLabel" class="form-label"></label>
                    <input type="number" id="analysisTemplateOrder" class="dialog-field dialog-field-narrow" min="1" max="99" value="1">
                    <div class="help-text" data-i18n="templateOrderHelp"></div>
                  </div>
                </div>
                <div class="dialog-footer">
                  <button id="cancelAnalysisTemplate" class="btn-secondary" data-i18n="cancelButton"></button>
                  <button id="saveAnalysisTemplate" class="btn-primary" data-i18n="saveButton"></button>
                </div>
              </div>
            </div>
          </div>
        </section>

        <!-- 数据同步 -->
        <section id="data-sync" class="settings-section">
          <h1 data-i18n="dataSyncTitle"></h1>

          <!-- 云同步（WebDAV） -->
          <div class="sync-card sync-cloud-card">
            <div class="sync-card-header">
              <div class="sync-card-heading">
                <img class="sync-card-icon" src="../icons/cloud-sync.svg" alt="" aria-hidden="true">
                <div>
                  <h2 data-i18n="cloudSyncTitle"></h2>
                  <p class="sync-card-description" data-i18n="cloudSyncDescription"></p>
                </div>
              </div>
              <span class="sync-badge" data-i18n="syncProviderWebdav"></span>
            </div>

            <div class="sync-enable-row">
              <label class="sync-checkbox-label">
                <input type="checkbox" id="syncEnabled">
                <span data-i18n="syncEnabledLabel"></span>
              </label>
            </div>

            <!-- WebDAV 连接配置 -->
            <div class="sync-connection-table" id="syncConnectionConfig">
              <div class="sync-table-row sync-table-header">
                <div class="sync-table-cell" data-i18n="syncAuthType"></div>
                <div class="sync-table-cell sync-cell-url" data-i18n="syncUrlHeader"></div>
                <div id="syncUsernameHeader" class="sync-table-cell" data-i18n="syncUsername"></div>
                <div id="syncPasswordHeader" class="sync-table-cell" data-i18n="syncPassword"></div>
              </div>
              <div class="sync-table-row sync-table-body">
                <div class="sync-table-cell">
                  <select id="syncAuthType" class="sync-field-select">
                    <option value="password" data-i18n="syncAuthPassword"></option>
                    <option value="token" data-i18n="syncAuthToken"></option>
                  </select>
                </div>
                <div class="sync-table-cell sync-cell-url">
                  <input type="url" id="syncUrl" class="sync-field-input" placeholder="https://your-webdav-server.com/dav/" data-i18n-placeholder="syncUrlPlaceholder">
                </div>
                <div id="syncUsernameCell" class="sync-table-cell">
                  <input type="text" id="syncUsername" class="sync-field-input" placeholder="" data-i18n-placeholder="syncUsernamePlaceholder">
                </div>
                <div class="sync-table-cell sync-cell-password">
                  <input type="password" id="syncPassword" class="sync-field-input" data-i18n-placeholder="syncPasswordPlaceholder" placeholder="••••••••" autocomplete="current-password">
                  <button class="sync-password-toggle" id="togglePassword" type="button" data-i18n-aria-label="syncTogglePasswordAriaLabel" aria-label="Show password">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                  </button>
                </div>
              </div>
            </div>

            <!-- 操作按钮与状态 -->
            <div class="sync-actions">
              <button id="saveSyncConfig" class="btn-primary sync-save-btn" data-i18n="saveButton"></button>
              <button id="importFromSync" class="btn-secondary" data-i18n="syncImportButton"></button>
            </div>
          </div>

          <div class="sync-card sync-local-card">
            <div class="sync-card-header">
              <div class="sync-card-heading">
                <img class="sync-card-icon" src="../icons/download.svg" alt="" aria-hidden="true">
                <div>
                  <h2 data-i18n="localSyncTitle"></h2>
                  <p class="sync-card-description" data-i18n="localSyncDescription"></p>
                </div>
              </div>
              <span class="sync-badge sync-badge-muted" data-i18n="localSyncBadge"></span>
            </div>
            <div class="sync-actions">
              <button id="exportLocalSync" class="btn-primary" data-i18n="localSyncExportButton"></button>
              <button id="importLocalSync" class="btn-secondary" data-i18n="localSyncImportButton"></button>
            </div>
            <input type="file" id="localSyncFileInput" accept="application/json,.json" hidden>
          </div>

          <div class="sync-card sync-cloud-card">
            <div class="sync-card-header">
              <div class="sync-card-heading">
                <img class="sync-card-icon" src="../icons/cloud-sync.svg" alt="" aria-hidden="true">
                <div>
                  <h2 data-i18n="googleDriveSyncTitle"></h2>
                  <p class="sync-card-description" data-i18n="googleDriveSyncDescription"></p>
                </div>
              </div>
              <span class="sync-badge" data-i18n="googleDriveSyncBadge"></span>
            </div>

            <div id="googleDriveSyncAccount" class="sync-card-description">Not connected yet</div>

            <div class="sync-actions">
              <button id="connectGoogleDriveSync" class="btn-primary">
                <span data-i18n="googleDriveSyncConnectButton"></span>
              </button>
              <button id="disconnectGoogleDriveSync" class="btn-secondary" data-i18n="googleDriveSyncDisconnectButton"></button>
            </div>
          </div>

          <div id="syncStatus" class="sync-status" style="display:none;"></div>
        </section>

        <section id="language-settings" class="settings-section">
          <h1 data-i18n="languageSettingsTitle"></h1>
          <div class="site-section unified-settings-panel">
            <div id="languageSettingsContainer" class="site-configs"></div>
          </div>
        </section>

        <!-- 暂时隐藏 Remote Search 设置页
        <section id="remote-search" class="settings-section">
          <h1 data-i18n="remoteSearchTitle"></h1>
          <p class="section-description" data-i18n="remoteSearchDescription"></p>

          <div class="remote-search-grid">
            <div class="remote-card">
              <div class="remote-card-header">
                <h2 data-i18n="remoteSearchTitle"></h2>
                <span id="remoteSearchConnectionBadge" class="remote-status-badge" data-status="disabled" data-i18n="remoteSearchStatusDisabled"></span>
              </div>
              <div class="remote-settings-grid">
                <label class="remote-checkbox-row" for="remoteSearchEnabled">
                  <input type="checkbox" id="remoteSearchEnabled">

                </label>
                <div class="remote-field">
                  <label for="remoteSearchRelayUrl" data-i18n="remoteSearchRelayUrlLabel">Relay URL</label>
                  <input type="url" id="remoteSearchRelayUrl" class="sync-field-input" data-i18n-placeholder="remoteSearchRelayUrlPlaceholder" placeholder="http://127.0.0.1:8787">
                  <div class="site-config-help" data-i18n="remoteSearchRelayUrlHelp"></div>

                  <label for="remoteSearchDesktopName" data-i18n="remoteSearchDesktopNameLabel"></label>
                  <input type="text" id="remoteSearchDesktopName" class="sync-field-input" data-i18n-placeholder="remoteSearchDesktopNamePlaceholder" placeholder="My Chrome">

              </div>
              <div class="remote-actions">

                <div class="remote-meta-row">
                  <span class="remote-meta-label" data-i18n="remoteSearchPhoneNameLabel"></span>
                  <span id="remoteSearchPendingPhoneName" class="remote-meta-value">-</span>
                </div>
                <div class="remote-meta-row">
                  <span class="remote-meta-label" data-i18n="remoteSearchPhonePlatformLabel"></span>
                  <span id="remoteSearchPendingPhonePlatform" class="remote-meta-value">-</span>

                  <span class="remote-meta-label" data-i18n="remoteSearchFingerprintLabel"></span>
                  <span id="remoteSearchPendingFingerprint" class="remote-meta-value">-</span>
                </div>
              </div>
              <div class="remote-actions">
                <button id="remoteSearchApprovePair" class="btn-primary" data-i18n="remoteSearchApproveButton"></button>
                <button id="remoteSearchRejectPair" class="btn-secondary" data-i18n="remoteSearchRejectButton"></button>
              </div>
            </div>

            <div class="remote-card">

                <h2 data-i18n="remoteSearchPairedPhoneTitle"></h2>

                    <span id="remoteSearchPairedPhoneName" class="remote-meta-value">-</span>
                  </div>

                    <span class="remote-meta-label" data-i18n="remoteSearchPhonePlatformLabel"></span>

                <div class="remote-actions">

            <div class="remote-card">

        <section id="membership" class="settings-section">
          <h1 data-i18n="settingsNavProTitle">Account</h1>

          <div id="membershipStatusCard" class="membership-status-card membership-account-card" hidden>
            <div class="membership-status-inner membership-account-inner">
              <div class="membership-account-main">
                <div id="membershipAvatar" class="membership-account-avatar" aria-hidden="true" hidden>
                  <img id="membershipAvatarImage" class="membership-account-avatar-image" src="" alt="" hidden>
                  <span id="membershipAvatarFallback" class="membership-account-avatar-fallback"></span>
                </div>
                <div class="membership-account-copy">
                  <div class="membership-account-title-row">
                    <h2 id="membershipAccountName" class="membership-account-name"></h2>
                  </div>
                  <div id="membershipEmail" class="membership-email"></div>
                </div>
              </div>
              <button id="membershipLogoutBtn" class="btn-secondary membership-account-logout" type="button" data-i18n-aria-label="logout" data-i18n-title="logout" aria-label="Log out">
