<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title data-i18n="appName"></title>
  <link rel="stylesheet" href="../shared/sidebar.css">
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="page-layout">
    <!-- 左侧导航栏（与 homepage 风格一致） -->
    <nav class="sidebar-nav">
      <div class="sidebar-nav-header">
        <a class="app-icon-link" href="../homepage/homepage.html" title="Go to homepage" aria-label="Go to homepage">
          <img class="app-icon" src="../icons/icon48.png" alt="">
        </a>
      </div>
      <div class="action-links">
        <a href="#quick-entry" class="action-link nav-link active" data-section="quick-entry">
          <img class="action-link-icon" src="../icons/extension-setting.svg" alt="" aria-hidden="true">
          <span data-i18n="configButtonTitle">快捷入口设置</span>
        </a>
        <a href="#disabled-sites" class="action-link nav-link" data-section="disabled-sites">
          <img class="action-link-icon" src="../icons/close.svg" alt="" aria-hidden="true">
          <span data-i18n="disabledSitesTitle">禁用网站</span>
        </a>
        <a href="#prompt-templates" class="action-link nav-link" data-section="prompt-templates">
          <img class="action-link-icon" src="../icons/edit.svg" alt="" aria-hidden="true">
          <span data-i18n="promptTemplatesTitle">提示词模板</span>
        </a>
        <a href="#data-sync" class="action-link nav-link" data-section="data-sync">
          <img class="action-link-icon" src="../icons/extension-setting.svg" alt="" aria-hidden="true">
          <span data-i18n="dataSyncTitle">数据同步</span>
        </a>
      </div>
    </nav>

    <!-- 主内容区域 -->
    <main class="main-content">
      <div class="container">
        <!-- 快捷入口设置 -->
        <section id="quick-entry" class="settings-section">
          <h1 data-i18n="configButtonTitle">快捷入口设置</h1>
          <div class="site-section">
            <div id="buttonSiteConfigs" class="site-configs"></div>
          </div>
        </section>

        <!-- 禁用网站管理 -->
        <section id="disabled-sites" class="settings-section">
          <h1 data-i18n="disabledSitesTitle">悬浮球禁用网站</h1>
          <p data-i18n="disabledSitesDescription" style="color: #666; margin-bottom: 20px;">管理悬浮球被禁用的网站，您可以在这里重新启用悬浮球</p>
          
          <div class="disabled-sites-section">
            <div id="disabledSitesList" class="disabled-sites-list">
              <!-- 禁用网站列表将在这里动态生成 -->
            </div>
          </div>
        </section>

        <!-- 提示词模板管理 -->
        <section id="prompt-templates" class="settings-section">
          <h1 data-i18n="promptTemplatesTitle">提示词模板管理</h1>
          <p data-i18n="promptTemplatesDescription" style="color: #666; margin-bottom: 20px;">自定义搜索建议按钮的提示词模板</p>
          
          <div class="prompt-templates-section">
            <!-- 添加新模板按钮 -->
            <div class="template-header" style="margin-bottom: 20px;">
              <button id="addTemplateBtn" class="add-template-btn" style="
                background: #4CAF50;
                color: white;
                border: none;
                padding: 10px 20px;
                border-radius: 6px;
                cursor: pointer;
                font-size: 14px;
                display: flex;
                align-items: center;
                gap: 5px;
              ">
                <span>+ </span><span data-i18n="addTemplateButton">添加新模板</span>
              </button>
            </div>

            <!-- 模板列表 -->
            <div id="templatesList" class="templates-list">
              <!-- 模板项将动态生成 -->
            </div>

            <!-- 添加/编辑模板对话框 -->
            <div id="templateDialog" class="template-dialog" style="display: none;">
              <div class="dialog-overlay" id="dialogOverlay" style="
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.5);
                z-index: 1000;
              "></div>
              <div class="dialog-content" style="
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                background: white;
                border-radius: 12px;
                padding: 0;
                max-width: 500px;
                width: 90%;
                z-index: 1001;
                box-shadow: 0 10px 30px rgba(0,0,0,0.3);
              ">
                <div class="dialog-header" style="
                  padding: 20px 24px 16px;
                  border-bottom: 1px solid #eee;
                  display: flex;
                  justify-content: space-between;
                  align-items: center;
                ">
                  <h3 id="dialogTitle" data-i18n="addTemplateTitle" style="margin: 0; font-size: 18px;">添加提示词模板</h3>
                  <button class="dialog-close" id="dialogClose" style="
                    background: none;
                    border: none;
                    font-size: 20px;
                    cursor: pointer;
                    color: #999;
                    width: 24px;
                    height: 24px;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                  ">×</button>
                </div>
                <div class="dialog-body" style="padding: 20px 24px;">
                  <div class="form-group" style="margin-bottom: 16px;">
                    <label for="templateName" data-i18n="templateNameLabel" style="
                      display: block;
                      margin-bottom: 8px;
                      font-weight: 500;
                      color: #333;
                    ">模板名称:</label>
                    <input type="text" id="templateName" placeholder="例如：风险分析" maxlength="20" style="
                      width: 100%;
                      padding: 8px 12px;
                      border: 1px solid #ddd;
                      border-radius: 4px;
                      font-size: 14px;
                      box-sizing: border-box;
                    ">
                    <div class="help-text" data-i18n="templateNameHelp" style="
                      font-size: 12px;
                      color: #666;
                      margin-top: 4px;
                    ">显示在按钮上的文字</div>
                  </div>
                  
                  <div class="form-group" style="margin-bottom: 16px;">
                    <label for="templateQuery" data-i18n="templateQueryLabel" style="
                      display: block;
                      margin-bottom: 8px;
                      font-weight: 500;
                      color: #333;
                    ">查询模板:</label>
                    <textarea id="templateQuery" placeholder="例如：导致失败的原因:「{query}」" rows="3" style="
                      width: 100%;
                      padding: 8px 12px;
                      border: 1px solid #ddd;
                      border-radius: 4px;
                      font-size: 14px;
                      box-sizing: border-box;
                      resize: vertical;
                      font-family: inherit;
                    "></textarea>
                    <div class="help-text" data-i18n="templateQueryHelp" style="
                      font-size: 12px;
                      color: #666;
                      margin-top: 4px;
                    ">使用 {query} 作为用户输入的占位符</div>
                  </div>

                  <div class="form-group" style="margin-bottom: 0;">
                    <label for="templateOrder" data-i18n="templateOrderLabel" style="
                      display: block;
                      margin-bottom: 8px;
                      font-weight: 500;
                      color: #333;
                    ">显示顺序:</label>
                    <input type="number" id="templateOrder" min="1" max="99" value="1" style="
                      width: 100px;
                      padding: 8px 12px;
                      border: 1px solid #ddd;
                      border-radius: 4px;
                      font-size: 14px;
                    ">
                    <div class="help-text" data-i18n="templateOrderHelp" style="
                      font-size: 12px;
                      color: #666;
                      margin-top: 4px;
                    ">数字越小越靠前显示</div>
                  </div>
                </div>
                <div class="dialog-footer" style="
                  padding: 16px 24px 20px;
                  border-top: 1px solid #eee;
                  display: flex;
                  justify-content: flex-end;
                  gap: 12px;
                ">
                  <button id="cancelTemplate" class="btn-secondary" data-i18n="cancelButton" style="
                    background: #f5f5f5;
                    color: #666;
                    border: 1px solid #ddd;
                    padding: 8px 16px;
                    border-radius: 4px;
                    cursor: pointer;
                    font-size: 14px;
                  ">取消</button>
                  <button id="saveTemplate" class="btn-primary" data-i18n="saveButton" style="
                    background: #4CAF50;
                    color: white;
                    border: none;
                    padding: 8px 16px;
                    border-radius: 4px;
                    cursor: pointer;
                    font-size: 14px;
                  ">保存</button>
                </div>
              </div>
            </div>
          </div>
        </section>
        
        <!-- 数据同步 -->
        <section id="data-sync" class="settings-section">
          <h1 data-i18n="dataSyncTitle">数据同步</h1>
          <p class="section-description" data-i18n="dataSyncDescription">跨设备同步您的所有设置与数据</p>

          <!-- 同步配置卡片 -->
          <div class="sync-card">
            <div class="sync-enable-row">
              <label class="sync-checkbox-label">
                <input type="checkbox" id="syncEnabled">
                <span data-i18n="syncEnabledLabel">启用数据同步至</span>
              </label>
              <select id="syncProvider" class="sync-provider-select">
                <option value="webdav">WebDAV</option>
              </select>
            </div>
          </div>

          <!-- WebDAV 连接配置 -->
          <div class="sync-connection-table" id="syncConnectionConfig">
            <div class="sync-table-row sync-table-header">
              <div class="sync-table-cell" data-i18n="syncAuthType">鉴权类型</div>
              <div class="sync-table-cell sync-cell-url">URL</div>
              <div id="syncUsernameHeader" class="sync-table-cell" data-i18n="syncUsername">用户名</div>
              <div id="syncPasswordHeader" class="sync-table-cell" data-i18n="syncPassword">密码</div>
            </div>
            <div class="sync-table-row sync-table-body">
              <div class="sync-table-cell">
                <select id="syncAuthType" class="sync-field-select">
                  <option value="password" data-i18n="syncAuthPassword">password</option>
                  <option value="token" data-i18n="syncAuthToken">token</option>
                </select>
              </div>
              <div class="sync-table-cell sync-cell-url">
                <input type="url" id="syncUrl" class="sync-field-input" placeholder="https://your-webdav-server.com/dav/" data-i18n-placeholder="syncUrlPlaceholder">
              </div>
              <div id="syncUsernameCell" class="sync-table-cell">
                <input type="text" id="syncUsername" class="sync-field-input" placeholder="" data-i18n-placeholder="syncUsernamePlaceholder">
              </div>
              <div class="sync-table-cell sync-cell-password">
                <input type="password" id="syncPassword" class="sync-field-input" placeholder="••••••••" autocomplete="current-password">
                <button class="sync-password-toggle" id="togglePassword" type="button" aria-label="Show password">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
              </div>
            </div>
          </div>

          <!-- 操作按钮与状态 -->
          <div class="sync-actions">
            <button id="saveSyncConfig" class="btn-primary sync-save-btn" data-i18n="saveButton">保存</button>
            <button id="importFromSync" class="btn-secondary" data-i18n="syncImportButton">从云端恢复</button>
          </div>
          <div id="syncStatus" class="sync-status" style="display:none;"></div>
        </section>

        <div class="contact-info" data-i18n="contactInfo"></div>
      </div>
    </main>
  </div>
  
  <!-- Toast提示 -->
  <div id="toast" class="toast"></div>

  <script src="../config/firebaseConfig.js"></script>
  <script src="../config/baseConfig.js"></script>
  <script src="../firebase/firebase-auth.js"></script>
  <script src="../firebase/stripe-payment.js"></script>
  <script src="options.js"></script>
</body>
</html>
