<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title data-i18n="contactLink">Contact Me</title>
    <link rel="stylesheet" href="../shared/ui-tokens.css">
    <link rel="stylesheet" href="../shared/sidebar.css">
    <link rel="stylesheet" href="contact.css">
</head>
<body data-page="contact">
    <div class="page-layout">
        <div id="appSidebarMount"></div>
        <main class="main-content">
            <div class="container">
                <section class="settings-section">
                    <h1 data-i18n="contactLink">Contact Me</h1>
                    <p class="section-description" data-i18n="contactDescription">If AI site pages change, my extension may stop working. Feel free to contact me anytime and I can update it.</p>
                    <div id="contactList" class="contact-list" aria-live="polite"></div>
                </section>
                <section class="settings-section changelog-section">
                    <div class="section-header">
                        <h2 data-i18n="contactChangelogTitle">What's New</h2>
                    </div>
                    <div id="changelogContent" class="changelog-card" aria-live="polite"></div>
                </section>
            </div>
        </main>
    </div>

    <script src="../shared/site-launch-utils.js"></script>
    <script src="../config/baseConfig.js"></script>
    <script src="../shared/behavior-insights.js"></script>
    <script src="../config/analytics.js"></script>
    <script src="../shared/runtime-i18n.js"></script>
    <script src="../config/firebaseConfig.js"></script>
    <script src="../firebase/firebase-auth.js"></script>
    <script src="../firebase/firebase-sync.js"></script>
    <script src="../shared/sidebar.js"></script>
    <script src="contact.js"></script>
</body>
</html>
