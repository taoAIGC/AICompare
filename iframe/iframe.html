<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
   <!--  <title data-i18n="appName"></title>-->
    <title data-i18n="iframePageTitle">AI Compare</title>
    <link rel="stylesheet" href="iframe.css">
    <link rel="stylesheet" href="../shared/favorite-folder-modal.css">
</head>
<body>
    <div class="search-bar" id="searchBar">
        <div class="search-bar-drag-handle" id="searchBarDragHandle" data-i18n-title="searchBarDragHandleTitle" data-i18n-aria-label="searchBarDragHandleAriaLabel" title="" aria-label="">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="9" cy="6" r="1.5"/><circle cx="15" cy="6" r="1.5"/><circle cx="9" cy="12" r="1.5"/><circle cx="15" cy="12" r="1.5"/><circle cx="9" cy="18" r="1.5"/><circle cx="15" cy="18" r="1.5"/></svg>
        </div>
        <div class="search-input-container">
            <div class="input-wrapper">
                <textarea 
                    id="searchInput" 
                    placeholder=""
                    autofocus
                    rows="1"
                ></textarea>
                <div class="input-actions">
                    <!-- <button id="favoriteButton" class="favorite-btn" style="display: none;" data-i18n-title="favoriteButton" title="">
                        <img id="favoriteIcon" src="../icons/star_unsaved.svg" alt="收藏">
                    </button> -->
                    <!-- 文件上传按钮 -->
                    <button id="fileUploadButton" class="file-upload-btn" data-i18n-title="fileUploadButtonTitle" title="">
                        <img src="../icons/attachment.svg" data-i18n-alt="fileUploadButtonAlt" alt="">
                    </button>
                    <button id="searchButton" class="search-btn" data-i18n="startCompare">PK</button>
                </div>
            </div>
            <div id="querySuggestions" class="query-suggestions" style="display: none;">
                <!-- queryItem.name 将显示在这里 -->
            </div>
        </div>
        <!-- 右侧按钮组容器 -->
        <div class="search-bar-right-buttons">
            <!-- <div id="iconContainer">
                <img id="toggleIcon" src="../icons/down.svg" alt="Toggle" />
            </div> -->
            
            <!-- 导出回答按钮 -->
            <button id="exportResponsesButton" class="export-responses-btn" data-i18n="exportResponses" data-i18n-title="exportResponsesTitle" title="">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <title data-i18n="downloadIconTitle">Download</title>
                    <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <!-- 托盘 -->
                        <path d="M4 17h16v2a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-2z"/>
                        <!-- 箭头 -->
                        <path d="M12 3v12" />
                        <path d="M8 9l4 4 4-4" />
                    </g>
                </svg>
            </button>
        
            <!-- 隐藏的文件选择input -->
            <input type="file" id="fileInput" style="display: none;" multiple 
                accept="image/*,audio/*,video/*,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.odt,.ods,.odp,.rtf,.pages,.numbers,.key,.txt,.csv,.json,.xml,.html,.css,.js,.py,.java,.cpp,.c,.php,.zip,.rar,.7z,.gz,.tar,.wps,.et,.dps,.vsd,.vsdx,.pub,.one,.msg,.eml,.mpp">
            
            <!-- 
            <select id="analysisDropdown" disabled >
                <option value="">深度分析</option>
            </select>
            -->
            <div class="favorite-icon-container">
                <img src="../icons/star_unsaved.svg" class="favorite-icon" data-i18n="favoriteAllSites" title="Save All Response to Favorites">
            </div>
        </div> <!-- 结束 search-bar-right-buttons 容器 -->
    </div>
    <div id="iframes-container">
        <!-- iframes 将被动态插入到这里 -->
    </div>
    <div id="queryList" style="display: none;">
        <!-- 收藏的 query 列表将动态添加到这里 -->
    </div>
    <div id="quickTooltip" class="quick-tooltip" aria-hidden="true"></div>
    <script src="../config/baseConfig.js"></script>
    <script src="../config/analytics.js"></script>
    <script src="../config/firebaseConfig.js"></script>
    <script src="../firebase/firebase-auth.js"></script>
    <script src="../firebase/firebase-sync.js"></script>
    <script src="../shared/prompt-template-utils.js"></script>
    <script src="../shared/favorite-folder-modal.js"></script>
    <script type="module" src="iframe.js"></script>
    <script src="export-responses.js"></script>
    <script src="openclaw-bridge.js"></script>
</body>
</html>
