<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <!--  <title data-i18n="appName"></title>-->
    <title data-i18n="iframePageTitle"></title>
    <link rel="stylesheet" href="../shared/ui-tokens.css">
    <link rel="stylesheet" href="iframe.css">
    <link rel="stylesheet" href="../shared/favorite-folder-modal.css">
</head>
<body>
    <div class="search-bar" id="searchBar">
        <div class="search-bar-drag-handle" id="searchBarDragHandle" data-i18n-title="searchBarDragHandleTitle" data-i18n-aria-label="searchBarDragHandleAriaLabel" title="" aria-label="">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="9" cy="6" r="1.5"/><circle cx="15" cy="6" r="1.5"/><circle cx="9" cy="12" r="1.5"/><circle cx="15" cy="12" r="1.5"/><circle cx="9" cy="18" r="1.5"/><circle cx="15" cy="18" r="1.5"/></svg>
        </div>
        <div class="search-input-container">
            <div class="input-wrapper">
                <textarea 
                    id="searchInput" 
                    placeholder=""
                    autofocus
                    rows="1"
                ></textarea>
                <div class="input-actions">
                    <!-- 文件上传按钮 -->
                    <button id="fileUploadButton" class="file-upload-btn" data-i18n-title="fileUploadButtonTitle" title="">
                        <img src="../icons/attachment.svg" data-i18n-alt="fileUploadButtonAlt" alt="">
                    </button>
                    <button id="searchButton" class="search-btn" data-i18n="startCompare"></button>
                </div>
            </div>
            <div id="querySuggestions" class="query-suggestions" style="display: none;">
                <!-- queryItem.name 将显示在这里 -->
            </div>
        </div>
        <!-- 右侧按钮组容器 -->
        <div class="search-bar-right-buttons">
            <!-- <div id="iconContainer">
                <img id="toggleIcon" src="../icons/down.svg" alt="Toggle" />
            </div> -->

            <button
                id="deepResearchButton"
                class="deep-research-btn"
                type="button"
                hidden
                data-i18n="deepResearchButtonLabel"
                data-i18n-title="deepResearchButtonTitle"
                data-i18n-aria-label="deepResearchButtonTitle"
                title=""
                aria-label=""
            ></button>

            <button id="resetIframePageButton" class="timeline-toggle-btn" type="button" data-i18n-title="resetIframePageTitle" data-i18n-aria-label="resetIframePageTitle" title="" aria-label="">
                <img src="../icons/refresh-cw.svg" data-i18n-alt="resetIframePageTitle" alt="">
            </button>
            <button id="shareTimelineButton" class="timeline-toggle-btn" type="button" data-i18n-title="timelineCopyPreviewShare" data-i18n-aria-label="timelineCopyPreviewShare" title="" aria-label="">
                <img src="../icons/share.svg" data-i18n-alt="timelineCopyPreviewShare" alt="">
            </button>
        
            <!-- 隐藏的文件选择input -->
            <input type="file" id="fileInput" style="display: none;" multiple 
                accept="image/*,audio/*,video/*,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.odt,.ods,.odp,.rtf,.pages,.numbers,.key,.txt,.csv,.json,.xml,.html,.css,.js,.py,.java,.cpp,.c,.php,.zip,.rar,.7z,.gz,.tar,.wps,.et,.dps,.vsd,.vsdx,.pub,.one,.msg,.eml,.mpp">
            
            <!-- 
            <select id="analysisDropdown" disabled >
                <option value="">深度分析</option>
            </select>
            -->
        </div> <!-- 结束 search-bar-right-buttons 容器 -->
    </div>
    <section id="liveSummaryCard" class="live-summary-card" hidden aria-live="polite">
        <div class="live-summary-card-header">
            <div class="live-summary-card-heading">
                <div class="live-summary-card-title-row">
                    <div id="liveSummaryTitle" class="live-summary-card-title" data-i18n="liveSummaryTitle"></div>
                    <div
                        id="liveSummaryTabs"
                        class="live-summary-tabs"
                        role="tablist"
                        data-i18n-aria-label="liveSummaryTabsAriaLabel"
                        aria-label=""
                    ></div>
                    <div class="live-summary-actions-cluster">
                        <div class="live-summary-template-cluster">
                            <select
                                id="liveSummaryAnalysisTemplateSelect"
                                class="live-summary-analysis-select"
                                aria-label=""
                                data-i18n-aria-label="analysisPromptTemplateSelectLabel"
                            ></select>
                        </div>
                        <div class="live-summary-tools-cluster">
                            <div class="timeline-copy-preview-export-actions live-summary-export-actions">
                                <button
                                    id="liveSummaryShareButton"
                                    class="timeline-copy-preview-share"
                                    type="button"
                                    aria-label=""
                                    data-i18n-aria-label="timelineCopyPreviewShare"
                                >
                                    <img src="../icons/link.svg" alt="" aria-hidden="true">
                                </button>
                                <button
                                    id="liveSummaryDownloadButton"
                                    class="timeline-copy-preview-download"
                                    type="button"
                                    aria-label=""
                                    data-i18n-aria-label="timelineCopyPreviewDownload"
                                >
                                    <img src="../icons/download.svg" alt="" aria-hidden="true">
                                </button>
                                <button
                                    id="liveSummaryCopyButton"
                                    class="timeline-copy-preview-confirm"
                                    type="button"
                                    aria-label=""
                                    data-i18n-aria-label="timelineCopyPreviewConfirm"
                                >
                                    <img src="../icons/copy.svg" alt="" aria-hidden="true">
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="live-summary-card-subtitle-row">
                    <div class="live-summary-status-cluster">
                        <div class="live-summary-sites-cluster">
                            <div id="liveSummarySites" class="live-summary-card-sites"></div>
                            <div id="liveSummaryHint" class="live-summary-card-hint" hidden></div>
                        </div>
                        <div id="liveSummaryRetryCluster" class="live-summary-retry-cluster" hidden>
                            <button
                                id="liveSummaryImmediateAnalyzeButton"
                                class="live-summary-action-btn live-summary-toolbar-icon-btn"
                                type="button"
                                data-i18n-title="liveSummaryRefresh"
                                data-i18n-aria-label="liveSummaryRefresh"
                                hidden
                                title=""
                                aria-label=""
                            >
                                <img src="../icons/refresh-cw.svg" alt="" aria-hidden="true">
                            </button>
                        </div>
                    </div>
                </div>
                <div id="liveSummaryMeta" class="live-summary-card-meta" hidden></div>
            </div>
        </div>
        <div id="liveSummaryCardBody" class="live-summary-card-body">
            <div id="liveSummaryContent" class="live-summary-card-content"></div>
        </div>
    </section>
    <div id="iframes-container">
        <!-- iframes 将被动态插入到这里 -->
    </div>
    <div id="queryList" style="display: none;">
        <!-- 收藏的 query 列表将动态添加到这里 -->
    </div>
    <div id="timelinePanel" class="timeline-panel" hidden>
        <div class="timeline-panel-header">
            <div class="timeline-panel-heading">
                <div class="timeline-panel-title" data-i18n="timelinePanelTitle"></div>
                <div id="timelinePanelHint" class="timeline-panel-hint" data-i18n="timelineSharePickerHint" hidden></div>
            </div>
            <button id="timelineCloseButton" class="timeline-close-btn" type="button" data-i18n-title="closeButton" data-i18n-aria-label="closeButton" title="" aria-label="">×</button>
        </div>
        <div id="timelineList" class="timeline-list"></div>
    </div>
    <div id="quickTooltip" class="quick-tooltip" aria-hidden="true"></div>
    <script src="../shared/site-launch-utils.js"></script>
    <script src="../config/baseConfig.js"></script>
    <script src="../config/analytics.js"></script>
    <script src="../shared/runtime-i18n.js"></script>
    <script src="../shared/markdown-renderer.js"></script>
    <script src="../shared/prompt-template-utils.js"></script>
    <script src="../shared/submit-shortcut-utils.js"></script>
    <script src="../shared/textarea-resize-utils.js"></script>
    <script src="../shared/favorite-folder-modal.js"></script>
    <script src="../shared/extraction-core.js"></script>
    <script src="../config/agentCatalogData.js"></script>
    <script src="../config/agentCatalog.js"></script>
    <script src="../config/agentEngineConfig.js"></script>
    <script src="../shared/agent-prompt-utils.js"></script>
    <script src="../shared/hybrid-history-db.js"></script>
    <script src="timeline-utils.js"></script>
    <script src="../shared/analysis-session-utils.js"></script>
    <script type="module" src="iframe.js"></script>
    <script src="openclaw-bridge.js"></script>
</body>
</html>
